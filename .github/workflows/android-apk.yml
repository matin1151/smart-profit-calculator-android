name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "www/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: نصب Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: نصب وابستگی‌ها
        run: npm install

      - name: بررسی فایل‌های برنامه
        run: |
          test -f www/index.html
          test -f www/style.css
          test -f www/app.js

      - name: ساخت پروژه Android با Capacitor
        run: npx cap add android

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: ساخت APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: قرار دادن APK برای دانلود
        uses: actions/upload-artifact@v4
        with:
          name: smart-profit-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
